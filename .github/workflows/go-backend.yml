name: Go backend
on: [push, pull_request]
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: transitops
          POSTGRES_PASSWORD: transitops
          POSTGRES_DB: transitops
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U transitops" --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: '1.26.3' }
      - run: go vet ./...
      - run: go test ./...
      - uses: golangci/golangci-lint-action@v7
        with: { version: latest, working-directory: backend-go }
