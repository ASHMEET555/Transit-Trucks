version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: transitops
      POSTGRES_PASSWORD: transitops
      POSTGRES_DB: transitops
    ports:
      - "5432:5432"
    volumes:
      - transitops_pg:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DB_BACKEND: postgres
      POSTGRES_DSN: postgresql://transitops:transitops@postgres:5432/transitops
      SECRET_KEY: local-dev-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  backend-go:
    build:
      context: ./backend-go
    environment:
      POSTGRES_DSN: postgresql://transitops:transitops@postgres:5432/transitops
      SECRET_KEY: local-dev-secret-key
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  transitops_pg:
