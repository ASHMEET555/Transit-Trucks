version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: transitops
      POSTGRES_PASSWORD: transitops
      POSTGRES_DB: transitops
    ports:
      - "5432:5432"
    volumes:
      - transitops_pg:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    environment:
      DB_BACKEND: postgres
      POSTGRES_DSN: postgresql://transitops:transitops@postgres:5432/transitops
      SECRET_KEY: local-dev-secret-key
    ports:
      - "8000:8000"
    depends_on:
      - postgres

  backend-go:
    build:
      context: ./backend-go
    environment:
      POSTGRES_DSN: postgresql://transitops:transitops@postgres:5432/transitops
      SECRET_KEY: local-dev-secret-key
    ports:
      - "8001:8000"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # Dev-only OSRM demo server (<=1rps). Prepare the extract first, see
  # backend-go/docs/OSRM.md, and place region.osrm (+ sidecars) in ./osrm-data.
  osrm:
    image: osrm/osrm-backend
    ports:
      - "5000:5000"
    volumes:
      - ./osrm-data:/data
    command: osrm-routed --algorithm mld /data/region.osrm

  # Dev-only vehicle simulator. Runs only with the sim profile:
  #   SIM_ENABLED=1 docker compose --profile sim up simulator
  # SIM_ENABLED=1 is required so the backend accepts simulator ingest.
  # The service is env-gated: without SIM_ENABLED=1 the container idles.
  # Run: SIM_ENABLED=1 SIM_ADMIN_PASSWORD=... docker compose up simulator
  # Docs: backend-go/docs/SIMULATOR.md and backend-go/docs/OSRM.md.
  simulator:
    image: golang:1.26.10
    working_dir: /src
    volumes:
      - ./backend-go:/src
    command: sh -c 'if [ "$$SIM_ENABLED" = "1" ]; then exec go run ./cmd/simulator; else echo "simulator idle: set SIM_ENABLED=1 to run"; sleep infinity; fi'
    environment:
      BACKEND_URL: http://backend-go:8000
      POSTGRES_DSN: postgresql://transitops:transitops@postgres:5432/transitops
      SIM_ENABLED: ${SIM_ENABLED:-0}
      OSRM_URL: http://osrm:5000
      SIM_ADMIN_EMAIL: ${SIM_ADMIN_EMAIL:-admin@transitops.com}
      SIM_ADMIN_PASSWORD: ${SIM_ADMIN_PASSWORD:-}
    depends_on:
      - backend-go
      - osrm

volumes:
  transitops_pg:
